<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>No-Build Lit SPA Skeleton</title>
<!-- Crepe Core Layout Stylesheet -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/timvandehey/milkdown_vendor@main/dist/theme/common/style.css">

<!-- Crepe Dark Theme Stylesheet -->
<link id="crepe-theme-link" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/timvandehey/milkdown_vendor@main/dist/theme/crepe-dark/style.css">

<!-- Import Map for Browser ESM Resolving -->
<script type="importmap">
{
  "imports": {
    "@milkdown/crepe": "https://cdn.jsdelivr.net/gh/timvandehey/milkdown_vendor@main/dist/milkdown_crepe.js"
  }
}
</script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e7e9ee;
    --muted: #8b93a3;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex;
    gap: 1.5rem;
    align-items: center;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.95rem;
    padding: 0.4rem 0.7rem;
    border-radius: 6px;
  }
  header a.active { color: var(--text); background: #1f2430; }
  header a:hover { color: var(--text); }
  main { padding: 2rem 1.5rem;  margin: 0 auto; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.5rem;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 0.5rem 1rem;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  input {
    background: #0f1115;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 0.5rem 0.7rem;
    font-size: 0.9rem;
  }

.flex-container {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .flex-item {
    flex: 1 1 60ch;
    max-width: 100%;
  }

/* <div class="flex-container">
  <div class="flex-item">Item 1</div>
  <div class="flex-item">Item 2</div>
</div> */

/* Layout container */
.workspace-container {
  display: flex;
flex-wrap: wrap;
  gap: 1.0rem;
}

.workspace-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.5rem;
  flex: 1 1 60ch;
  /* max-width: 100%; */
  /* min-height: 400px;
  display: flex;
  flex-direction: column; */
}

.workspace-panel h2 {
  margin-top: 0;
  margin-bottom: 1rem;
  font-size: 1.2rem;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.5rem;
}

/* Raw markdown text rendering */
.raw-preview {
  /* width: 100%; */
  /* flex: 1; */
  background: #0f1115;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: monospace;
  padding: 1rem;
  resize: none;
  outline: none;
  font-size: 0.9rem;
  line-height: 1.5;
}

/* Responsive side-by-side behavior */

</style>
</head>
<body>

  <!-- app-router owns the whole page: nav + swapping views -->
  <app-router></app-router>

  <script type="module">

import { Crepe } from '@milkdown/crepe';

class CrepeEditor extends LitElement {
  static properties = {
    value: { type: String }
  };

  createRenderRoot() {
    return this; // Light DOM so global CSS themes apply
  }

  async firstUpdated() {
    const container = this.querySelector('.crepe-container');
    if (!container) return;

    try {
      this.crepe = new Crepe({
        root: container,
        defaultValue: this.value || ''
      });

      // Dispatch changes to the parent element
      this.crepe.on((listener) => {
        listener.markdownUpdated((ctx, markdown) => {
          this.dispatchEvent(new CustomEvent('change', {
            detail: { value: markdown },
            bubbles: true,
            composed: true
          }));
        });
      });

      this.editor = await this.crepe.create();
    } catch (err) {
      console.error("Failed to initialize Crepe editor:", err);
    }
  }

  disconnectedCallback() {
    super.disconnectedCallback();
    if (this.editor) {
      this.editor.destroy();
    }
  }

  render() {
    return html`<div class="crepe-container"></div>`;
  }
}
customElements.define('crepe-editor', CrepeEditor);

    // ---- 1. Lit, loaded straight from a CDN. No npm, no bundler. ----
    import { LitElement, html, css } from 'https://cdn.jsdelivr.net/gh/lit/dist@3/core/lit-core.min.js';

    // ---- 2. Shared state: a tiny pub-sub store, framework-agnostic. ----
    // Any component can import `store` and call store.subscribe(fn).
    // This is the whole "state management" layer for a small app —
    // swap for something bigger only if you actually need it.
    class Store extends EventTarget {
      #state = { 
          count: 0
        , name: ''
        , markdownContent: '# Welcome to Creape\n\nEdit this side-by-side!'
    };

      get state() { return this.#state; }

      set(partial) {
        this.#state = { ...this.#state, ...partial };
        this.dispatchEvent(new Event('change'));
      }

      subscribe(fn) {
        this.addEventListener('change', fn);
        return () => this.removeEventListener('change', fn);
      }
    }
    const store = new Store();

    // ---- 3. A reusable mixin so components re-render on store changes ----
    // (Optional pattern — you could also just call store.subscribe in connectedCallback)
    const StoreConsumer = (Base) => class extends Base {
      connectedCallback() {
        super.connectedCallback();
        this._unsub = store.subscribe(() => this.requestUpdate());
      }
      disconnectedCallback() {
        this._unsub?.();
        super.disconnectedCallback();
      }
    };

    // ---- 4. A minimal client-side router using the native History API ----
    // No dependency — ~20 lines gets you push-state routing.
    class Router extends EventTarget {
      constructor(routes) {
        super();
        this.routes = routes; // { '/': 'home-view', '/about': 'about-view' }
        window.addEventListener('popstate', () => this._notify());
      }
      navigate(path) {
        if (path === location.pathname) return;
        history.pushState({}, '', path);
        this._notify();
      }
      _notify() {
        this.dispatchEvent(new Event('navigate'));
      }
      get current() {
        return this.routes[location.pathname] ?? this.routes['/404'];
      }
    }
    const router = new Router({
      '/': 'home-view',
      '/about': 'about-view',
      '/editor': 'editor-view',
      '/404': 'notfound-view',
    });

    // ---- 5. Views: plain LitElement components ----

class EditorView extends StoreConsumer(LitElement) {
  createRenderRoot() { return this; }

  handleEditorChange(e) {
    store.set({ markdownContent: e.detail.value });
  }

  render() {
    const { markdownContent } = store.state;
    return html`
      <div class="workspace-container">
        <!-- Editor Panel -->
        <div class="workspace-panel">
          <h2>Editor</h2>
          <crepe-editor 
            .value=${markdownContent} 
            @change=${this.handleEditorChange}
          ></crepe-editor>
        </div>

        <!-- Render/Preview Panel -->
        <div class="workspace-panel">
          <h2>Markdown Output</h2>
          <textarea class="raw-preview" readonly>${markdownContent}</textarea>
        </div>
      </div>
    `;
  }
}
customElements.define('editor-view', EditorView);

    class HomeView extends StoreConsumer(LitElement) {
      // Light DOM (no shadow root) keeps global CSS above working as-is.
      // Use shadow DOM instead once components need real style encapsulation.
      createRenderRoot() { return this; }

      render() {
        const { count, name } = store.state;
        return html`
          <div class="card">
            <h2>Home</h2>
            <p>Shared state lives in one place; any component can read/write it.</p>
            <p>Count: <strong>${count}</strong></p>
            <button @click=${() => store.set({ count: count + 1 })}>
              Increment
            </button>
            <p style="margin-top:1rem">
              <input
                placeholder="Type your name"
                .value=${name}
                @input=${(e) => store.set({ name: e.target.value })}
              />
            </p>
            ${name ? html`<p>Hello, ${name} 👋</p>` : ''}
          </div>
        `;
      }
    }
    customElements.define('home-view', HomeView);

    class AboutView extends LitElement {
      createRenderRoot() { return this; }
      render() {
        return html`
          <div class="card">
            <h2>About</h2>
            <p>This view is a separate Custom Element, loaded by the router.
               Each view is just a class — no framework-specific file format.</p>
          </div>
        `;
      }
    }
    customElements.define('about-view', AboutView);

    class NotFoundView extends LitElement {
      createRenderRoot() { return this; }
      render() {
        return html`<div class="card"><h2>404</h2><p>Nothing here.</p></div>`;
      }
    }
    customElements.define('notfound-view', NotFoundView);

    // ---- 6. The app shell: nav + outlet, listens to the router ----
    class AppRouter extends LitElement {
      createRenderRoot() { return this; }

      connectedCallback() {
        super.connectedCallback();
        router.addEventListener('navigate', () => this.requestUpdate());

        // Intercept clicks on internal links so they don't full-reload the page
        this.addEventListener('click', (e) => {
          const a = e.target.closest('a[data-link]');
          if (!a) return;
          e.preventDefault();
          router.navigate(a.getAttribute('href'));
        });
      }

      render() {
        // lit-html can't interpolate a tag *name* directly (`<${view}>` isn't valid),
        // so build the element imperatively and pass it in as a value instead.
        const el = document.createElement(router.current);

        return html`
          <header>
            <a data-link href="/" class=${location.pathname === '/' ? 'active' : ''}>Home</a>
            <a data-link href="/editor" class=${location.pathname === '/editor' ? 'active' : ''}>Editor</a>
            <a data-link href="/about" class=${location.pathname === '/about' ? 'active' : ''}>About</a>
          </header>
          <main>${el}</main>
        `;
      }
    }
    customElements.define('app-router', AppRouter);
  </script>
</body>
</html>
